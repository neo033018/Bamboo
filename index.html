und:#ffcf4d;color:#3b2e0c;font-weight:900;box-shadow:0 5px 0 #c89728;transition:transform .2s}.primary:hover{transform:translateY(-3px)}.sectiontitle{font-size:25px;margin:27px 0 14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.tile{min-height:178px;text-align:left;border:1px solid #ffffffaf;border-radius:29px;padding:20px;box-shadow:0 12px 24px #21476027;transition:transform .22s,box-shadow .22s;display:flex;flex-direction:column;justify-content:space-between;color:#fff;position:relative;overflow:hidden}.tile:hover{transform:translateY(-5px);box-shadow:0 18px 35px #21476048}.tile .ico{font-size:49px;filter:drop-shadow(0 5px 5px #0002)}.tile strong{font-size:23px}.tile small{font-size:13px;opacity:.94}.blue{background:linear-gradient(135deg,#72caff,#2074d9)}.green{background:linear-gradient(135deg,#63dc9e,#079d65)}.orange{background:linear-gradient(135deg,#ffd17a,#ee8434)}.purple{background:linear-gradient(135deg,#c99dff,#8650d7)}.teal{background:linear-gradient(135deg,#69dbe1,#1698a7)}.pink{background:linear-gradient(135deg,#ffb4d2,#d95095)}.info{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px}.glass{background:var(--glass);border:1px solid white;border-radius:28px;padding:23px;box-shadow:0 10px 26px #24546719}.dock{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:min(960px,calc(100% - 22px));display:flex;justify-content:space-around;gap:3px;padding:9px;background:#ffffffdf;backdrop-filter:blur(22px);border:1px solid white;border-radius:27px;box-shadow:0 15px 35px #193b5861;z-index:4}.nav{border:0;background:transparent;color:#416074;display:flex;align-items:center;flex-direction:column;gap:2px;border-radius:18px;min-width:0;padding:7px 9px;font-size:11px;font-weight:800}.nav i{font-style:normal;font-size:24px}.nav.active{background:var(--accent);color:white}.pagehead{background:linear-gradient(125deg,var(--accent),#203f78);border-radius:32px;color:white;padding:29px;box-shadow:var(--shadow);margin-bottom:20px}.pagehead h1{margin:4px 0;font-size:clamp(31px,5vw,49px)}.pagehead p{margin:0;opacity:.92}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#ffffffde;border:1px solid white;border-radius:28px;padding:23px;box-shadow:0 9px 22px #234b6a1c}.card h2{margin:0 0 13px}.action{border:0;border-radius:16px;background:var(--accent);color:white;padding:12px 16px;font-weight:850;margin:4px 4px 4px 0}.ghost{background:#edf3fa;color:#1f4b6b}.flash{text-align:center;min-height:250px;background:linear-gradient(145deg,#fff,#e3f1ff);border:2px solid #fff;border-radius:24px;padding:20px}.flash .emoji{font-size:72px}.flash .word{font-size:38px;font-weight:1000;margin:6px}.flash .translation{font-size:24px}.muted{color:#587183}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{background:#f2f7fc;border:2px solid #d6e6f4;border-radius:18px;padding:16px;text-align:left;font-weight:800;color:#22465d}.option:disabled{opacity:.7}.success{color:#078b58;font-weight:850}.error{color:#d45555;font-weight:850}.track{height:12px;background:#d5e7ed;border-radius:20px;overflow:hidden}.track b{display:block;height:100%;background:#42c87c;border-radius:20px}.mini{padding:13px;background:#eff7ff;border-radius:16px;margin:9px 0}.chat{height:290px;overflow:auto;background:#edf8f3;border-radius:20px;padding:15px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:86%;background:white;border-radius:19px;padding:12px;line-height:1.5}.bubble.me{align-self:flex-end;background:#c8ebff}.inputrow{display:flex;gap:7px;margin-top:12px}.inputrow input{flex:1;min-width:0;border:1px solid #c4dae4;border-radius:15px;padding:12px}.tag{display:inline-block;border-radius:15px;background:#eaf3ff;padding:9px 12px;margin:4px;font-weight:750}.footnote{font-size:12px;color:#567084}.character{font-size:64px;display:inline-block;animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.layout,.info{grid-template-columns:1fr}.shell{padding:14px 13px 115px}.hero{min-height:250px;padding:24px}.dock{overflow-x:auto;justify-content:flex-start}.nav{min-width:64px}.tile{min-height:155px}.top{align-items:flex-start}.stats{justify-content:flex-end}.pill{font-size:12px;padding:8px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div id="app" class="app" data-page="home"><div class="shell"><header class="top"><div class="brand"><span>🐼</span>BAMBOO <small style="font-size:11px;letter-spacing:1px">ADVENTURES</small></div><div class="stats"><div class="pill" id="xp">⭐ 0 XP</div><div class="pill" id="coins">🪙 0</div><div class="pill">👕 #7</div></div></header><main id="main"></main></div><nav class="dock" id="dock"></nav></div><script>
const DATA=[['⚽','Goalkeeper','守门员','Вратарь','The goalkeeper saved the ball.'],['🦁','Brave','勇敢的','Смелый','The brave player scored a goal.'],['🌎','Explore','探索','Исследовать','We explore the ancient castle.'],['🏰','Castle','城堡','Замок','The castle is on the hill.'],['🚀','Adventure','冒险','Приключение','Our adventure begins today.'],['🧠','Practice','练习','Практиковаться','I practice English every day.'],['⚽','Pass','传球','Передавать','Please pass the ball.'],['🦖','Ancient','古代的','Древний','Dinosaurs lived in ancient times.']];const quiz=[{q:'Choose the correct sentence',a:['He play football yesterday.','He played football yesterday.','He playing football.'],ok:1,why:'Past tense: play → played.'},{q:'What does “goalkeeper” mean?',a:['守门员','裁判','前锋'],ok:0,why:'A goalkeeper protects the goal.'},{q:'Complete: “She ___ to school every day.”',a:['go','goes','going'],ok:1,why:'With she/he/it, use goes.'},{q:'Choose the correct translation: “Brave”',a:['慢的','勇敢的','危险的'],ok:1,why:'Brave means courageous.'},{q:'Which sentence is a question?',a:['Where is my ball?','My ball is here.','I like football.'],ok:0,why:'Questions ask for information.'},{q:"Choose the correct sentence.",a:["I am eight years old.", "I have eight years.", "I is eight years old."],ok:0,why:"Use “I am” when saying your age."},{q:"Complete: “They ___ playing football.”",a:["is", "are", "am"],ok:1,why:"They are playing football."},{q:"What is the opposite of “fast”?",a:["slow", "quick", "strong"],ok:0,why:"Slow is the opposite of fast."},{q:"Choose the past tense of “go”.",a:["goed", "went", "going"],ok:1,why:"Go → went."},{q:"Complete: “I have ___ apple.”",a:["a", "an", "the"],ok:1,why:"Use “an” before a vowel sound."},{q:"Which word means “快乐的”?",a:["angry", "happy", "tired"],ok:1,why:"Happy means 快乐的."},{q:"Choose the correct sentence.",a:["He can swims.", "He can swim.", "He can swimming."],ok:1,why:"After can, use the base verb."},{q:"Complete: “There ___ two pandas.”",a:["is", "are", "am"],ok:1,why:"Use are for plural nouns."},{q:"What is the plural of “child”?",a:["childs", "children", "childes"],ok:1,why:"The irregular plural is children."},{q:"Complete: “She ___ breakfast at 8.”",a:["eat", "eats", "eating"],ok:1,why:"She eats breakfast."},{q:"Which word means “探索”?",a:["explore", "forget", "borrow"],ok:0,why:"Explore means to discover new places."},{q:"Choose the correct question.",a:["Where you live?", "Where do you live?", "Where does you live?"],ok:1,why:"Use do with you."},{q:"Complete: “This book is ___ than that one.”",a:["big", "bigger", "biggest"],ok:1,why:"Use the comparative bigger."},{q:"Choose the correct preposition: “The cat is ___ the table.”",a:["under", "quick", "green"],ok:0,why:"Under describes position."},{q:"Which sentence is in the future?",a:["I will train tomorrow.", "I trained yesterday.", "I train every day."],ok:0,why:"Will + verb describes the future."},{q:"Complete: “We ___ to the park yesterday.”",a:["walk", "walked", "walking"],ok:1,why:"Yesterday indicates past tense."},{q:"What does “teammate” mean?",a:["队友", "裁判", "观众"],ok:0,why:"A teammate is someone on your team."},{q:"Choose the correct sentence.",a:["I don’t like rain.", "I doesn’t like rain.", "I not like rain."],ok:0,why:"Use don’t with I."},{q:"Complete: “___ you ever visited China?”",a:["Have", "Has", "Do"],ok:0,why:"Have you ever ...?"},{q:"What does “ancient” mean?",a:["现代的", "古代的", "快速的"],ok:1,why:"Ancient means very old or from long ago."},{q:"Choose the correct sentence.",a:["The boys is ready.", "The boys are ready.", "The boys am ready."],ok:1,why:"Use are with plural subjects."},{q:"Complete: “If it rains, we ___ inside.”",a:["stay", "stayed", "staying"],ok:0,why:"If it rains, we stay inside."},{q:"Which word means “brave”?",a:["勇敢的", "安静的", "缓慢的"],ok:0,why:"Brave means courageous."},{q:"Choose the correct form: “He ___ his homework now.”",a:["does", "is doing", "do"],ok:1,why:"Is doing describes something happening now."},{q:"Complete: “My brother is younger ___ me.”",a:["then", "than", "that"],ok:1,why:"Use than for comparisons."}];const footballQuiz=[{q:"How many players are on the field for one team in standard football?",a:["9", "11", "13"],ok:1,why:"Each team normally has 11 players."},{q:"Who can use their hands inside their own penalty area?",a:["Goalkeeper", "Striker", "Winger"],ok:0,why:"The goalkeeper can handle the ball in their penalty area."},{q:"What is a hat-trick?",a:["Three goals by one player", "Three assists", "Three yellow cards"],ok:0,why:"A hat-trick means three goals in a match."},{q:"What does “dribble” mean?",a:["Run while controlling the ball", "Kick the ball out", "Stop playing"],ok:0,why:"Dribbling means moving with the ball under control."},{q:"How long is a standard senior football match, excluding stoppage time?",a:["60 minutes", "90 minutes", "120 minutes"],ok:1,why:"Two halves of 45 minutes."},{q:"What is a corner kick awarded for?",a:["Ball crosses goal line off a defender", "Ball crosses sideline", "A player scores"],ok:0,why:"A defender last touched the ball before it crossed their goal line."},{q:"What does a red card mean?",a:["Player is sent off", "Free goal", "Half-time"],ok:0,why:"A red card sends the player off."},{q:"Which part of the foot is often used for accurate short passes?",a:["Inside of the foot", "Heel only", "Toe only"],ok:0,why:"The inside of the foot provides control."},{q:"What is an assist?",a:["Pass leading to a goal", "A foul", "A substitution"],ok:0,why:"An assist helps a teammate score."},{q:"What is offside mainly about?",a:["Attacking player position at the pass", "Shoe color", "Ball weight"],ok:0,why:"Offside depends on position and involvement when a teammate plays the ball."},{q:"Which skill helps you change direction quickly?",a:["Agility", "Sleeping", "Standing still"],ok:0,why:"Agility helps with quick direction changes."},{q:"What is a clean sheet?",a:["Conceding no goals", "Scoring five goals", "Wearing a new kit"],ok:0,why:"A clean sheet means conceding no goals."},{q:"Where is a penalty kick taken from in standard football?",a:["11 meters", "5 meters", "20 meters"],ok:0,why:"The penalty mark is 11 meters from the goal line."},{q:"What does “defender” mean?",a:["A player who helps protect the goal", "The referee", "A spectator"],ok:0,why:"Defenders try to stop attacks."},{q:"Why should you look up while dribbling?",a:["To see teammates and space", "To count clouds", "To stop running"],ok:0,why:"Looking up helps you make decisions."}];const discoverQuiz=[{q:"Which civilization built the Great Pyramid of Giza?",a:["Ancient Egyptians", "Romans", "Vikings"],ok:0,why:"The Great Pyramid was built in ancient Egypt."},{q:"Which planet is known as the Red Planet?",a:["Mars", "Venus", "Neptune"],ok:0,why:"Iron oxide makes Mars look reddish."},{q:"Which dinosaur lived earlier?",a:["Stegosaurus", "T. rex", "Both at the same time"],ok:0,why:"Stegosaurus lived long before T. rex."},{q:"What did ancient Romans build for gladiator contests?",a:["Colosseum", "Eiffel Tower", "Big Ben"],ok:0,why:"The Colosseum hosted public spectacles."},{q:"Who was the first human to walk on the Moon?",a:["Neil Armstrong", "Yuri Gagarin", "Marco Polo"],ok:0,why:"Neil Armstrong stepped onto the Moon in 1969."},{q:"Which invention originated in ancient China?",a:["Paper", "Telephone", "Airplane"],ok:0,why:"Papermaking developed in China."},{q:"What is the largest planet in our Solar System?",a:["Earth", "Jupiter", "Mercury"],ok:1,why:"Jupiter is the largest planet."},{q:"What do fossils help scientists study?",a:["Ancient life", "Tomorrow’s weather", "Internet speed"],ok:0,why:"Fossils preserve traces of ancient organisms."},{q:"What is the closest star to Earth?",a:["The Sun", "Sirius", "Polaris"],ok:0,why:"Our Sun is a star."},{q:"Which ocean is the largest?",a:["Pacific", "Atlantic", "Arctic"],ok:0,why:"The Pacific is the largest ocean."},{q:"What do bees collect from flowers?",a:["Nectar", "Sand", "Stones"],ok:0,why:"Bees collect nectar and pollen."},{q:"What is the process by which plants make food using sunlight?",a:["Photosynthesis", "Evaporation", "Erosion"],ok:0,why:"Plants use sunlight to produce sugars."},{q:"Which continent is Egypt in?",a:["Africa", "Europe", "South America"],ok:0,why:"Egypt is in northeastern Africa."},{q:"What was the Silk Road?",a:["A network of trade routes", "One silk factory", "A Roman castle"],ok:0,why:"The Silk Roads connected many regions through trade."},{q:"How many legs does an insect have?",a:["Six", "Eight", "Ten"],ok:0,why:"Adult insects have six legs."}];const challengeQuiz=[{q:"Choose the synonym of “quick”.",a:["fast", "slow", "late"],ok:0,why:"Quick and fast have similar meanings."},{q:"What is 9 × 7?",a:["56", "63", "72"],ok:1,why:"9 × 7 = 63."},{q:"Which animal is a mammal?",a:["Dolphin", "Shark", "Salmon"],ok:0,why:"Dolphins breathe air and nurse their young."},{q:"Complete: “I ___ ready!”",a:["am", "is", "are"],ok:0,why:"Use am with I."},{q:"Which number comes next: 2, 4, 8, 16, ...?",a:["20", "24", "32"],ok:2,why:"Each number doubles."},{q:"Which planet has prominent rings?",a:["Saturn", "Mercury", "Mars"],ok:0,why:"Saturn is famous for its rings."},{q:"What does “score a goal” mean?",a:["进球", "传球", "犯规"],ok:0,why:"Score a goal means 进球."},{q:"How many sides does a hexagon have?",a:["5", "6", "8"],ok:1,why:"Hexa means six."},{q:"Which is the past tense of “eat”?",a:["eated", "ate", "eaten"],ok:1,why:"Eat → ate in simple past."},{q:"What is 100 − 37?",a:["63", "73", "67"],ok:0,why:"100 minus 37 is 63."},{q:"Which gas do humans need to breathe?",a:["Oxygen", "Helium", "Neon"],ok:0,why:"Our bodies use oxygen."},{q:"What is the opposite of “early”?",a:["late", "soon", "first"],ok:0,why:"Late is the opposite of early."},{q:"Which shape has three sides?",a:["Square", "Triangle", "Circle"],ok:1,why:"A triangle has three sides."},{q:"Which continent contains Brazil?",a:["Asia", "South America", "Europe"],ok:1,why:"Brazil is in South America."},{q:"Complete: “We ___ friends.”",a:["am", "is", "are"],ok:2,why:"We are friends."}];const nav=[['home','🏠','Home'],['english','📚','English'],['football','⚽','Football'],['discover','🏛️','Discover'],['challenges','🏆','Quests'],['world','🧱','World'],['shop','🛍️','Shop'],['ai','🐼','AI Bamboo']];let state;try{state={xp:0,coins:0,owned:[],completed:0,...JSON.parse(localStorage.getItem('bamboo-v3')||'{}')}}catch{state={xp:0,coins:0,owned:[],completed:0}}let page='home',wi=0,qi=0,answered=false,language='zh',chat=[];const main=document.getElementById('main'),app=document.getElementById('app');function save(){localStorage.setItem('bamboo-v3',JSON.stringify(state));document.getElementById('xp').textContent='⭐ '+state.xp+' XP';document.getElementById('coins').textContent='🪙 '+state.coins}function earn(x=20,c=10){state.xp+=x;state.coins+=c;state.completed++;save()}function header(title,sub,icon){return `<div class="pagehead"><div class="character">${icon}</div><h1>${title}</h1><p>${sub}</p></div>`}function tile(icon,name,desc,cls,target){return `<button class="tile ${cls}" onclick="go('${target}')"><span class="ico">${icon}</span><span><strong>${name}</strong><br><small>${desc}</small></span></button>`}function go(p){page=p;app.dataset.page=p;render();window.scrollTo({top:0,behavior:'smooth'})}function render(){save();document.getElementById('dock').innerHTML=nav.map(([id,ico,label])=>`<button class="nav ${page===id?'active':''}" onclick="go('${id}')"><i>${ico}</i>${label}</button>`).join('');if(page==='home'){main.innerHTML=`<section class="hero"><div><div class="pill" style="display:inline-block;color:#185b48;margin-bottom:18px">👋 Hey Emin! Ready for an adventure?</div><h1>Learn. Play.<br>Build your world.</h1><p>Your AI Bamboo buddy is waiting. New words, football missions, and amazing discoveries!</p><button class="primary" onclick="go('english')">Start learning →</button></div></section><h2 class="sectiontitle">Choose your adventure ✨</h2><div class="grid">${tile('📚','English','Words, speaking & mini-lessons','blue','english')}${tile('⚽','Football','Practice like a champion #7','green','football')}${tile('🏛️','Discover','History, science & facts','orange','discover')}${tile('🏆','Challenges','Quests & rewards','purple','challenges')}${tile('🧱','My World','Build your block universe','teal','world')}${tile('🛍️','Shop','Unlock costumes & friends','pink','shop')}${tile('🐼','AI Bamboo','Talk to your panda buddy','green','ai')}${tile('🎯','Daily Mission','Complete a learning quest','blue','challenges')}</div><div class="info"><div class="glass"><b>🎯 Today's mission</b><p>Complete an English quiz and earn 20 XP + 10 coins.</p><button class="action" onclick="go('english')">Let's do it</button></div><div class="glass"><b>💡 Did you know?</b><p>Cleopatra lived closer to the Moon landing than to the building of the Great Pyramid!</p><button class="action" onclick="go('discover')">Explore history</button></div></div>`}else if(page==='english'){main.innerHTML=header('English Quest','Flashcards • Listen • Speak • Learn','📚')+`<div class="layout"><section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2>🃏 Word Cards</h2><select id="lang" onchange="language=this.value;drawWord()"><option value="zh" ${language==='zh'?'selected':''}>🇨🇳 Chinese</option><option value="ru" ${language==='ru'?'selected':''}>🇷🇺 Russian</option></select></div><div id="flash"></div></section><section class="card"><h2>🎯 Mini Lesson</h2><p class="muted">Duolingo-inspired bite-sized questions</p><div id="quiz"></div></section></div><div class="glass" style="margin-top:18px"><h2>🎤 Speaking Practice</h2><p>Listen to the word, then press the microphone and say it aloud. Chrome speech recognition is experimental; this is not a full phonetic assessment.</p><button class="action" onclick="listenWord()">🎤 Say the word</button><span id="speechstatus" aria-live="polite"></span></div>`;drawWord();drawQuiz()}else if(page==='football'){main.innerHTML=header('Football Academy','Player #7 • Football knowledge • Training','⚽')+`<div class="layout"><div class="card"><h2>⚽ Football Quiz</h2><div id="categoryquiz"></div></div><div class="card"><h2>👕 Player #7</h2><div style="font-size:75px">⚽7️⃣</div><p>Answer questions to earn XP and coins!</p><p class="muted">${state.xp} XP earned so far</p></div></div>`;drawCategoryQuiz('football')}else if(page==='discover'){main.innerHTML=header('Discover Worlds','History • Science • Amazing facts','🏛️')+`<div class="layout"><div class="card"><h2>🌍 Discovery Quiz</h2><div id="categoryquiz"></div></div><div class="card"><h2>💡 Did you know?</h2><p>The Tyrannosaurus rex lived closer in time to humans than to Stegosaurus.</p><p>Explore the world through new questions every round!</p></div></div>`;drawCategoryQuiz('discover')}else if(page==='challenges'){main.innerHTML=header('Challenge Center','Mixed English • Math • Science • Football','🏆')+`<div class="layout"><div class="card"><h2>🐉 Dragon Challenge</h2><div id="categoryquiz"></div></div><div class="card"><h2>🏆 Earn rewards</h2><div style="font-size:80px">🐉💎</div><p>Answer each question correctly to earn 20 XP and 10 Bamboo Coins.</p><p class="muted">Every challenge can be replayed for practice.</p></div></div>`;drawCategoryQuiz('challenges')}else if(page==='world'){main.innerHTML=header('My Block World','Your learning builds a magical world','🧱')+`<div class="card"><div style="font-size:75px">🌲 🏡 🏰 🐉</div><h2>Adventure inventory</h2><p>Owned: ${state.owned.length?state.owned.join(', '):'Nothing yet — visit the shop!'}</p><p class="muted">An explorable 3D world is planned; this prototype has an inventory.</p></div>`}else if(page==='shop'){main.innerHTML=header('Bamboo Shop','Spend virtual coins — no real-money purchases','🛍️')+`<div class="grid">${[['🧢','Explorer Hat',40],['🐉','Baby Dragon',90],['🏰','Castle',150],['👕','Number 7 Kit',60]].map(([ico,name,price])=>`<div class="card" style="text-align:center"><div style="font-size:55px">${ico}</div><h2>${name}</h2><p>🪙 ${price}</p><button class="action" onclick="buy('${name}',${price})">${state.owned.includes(name)?'Owned ✓':'Unlock'}</button></div>`).join('')}</div>`}else if(page==='ai'){main.innerHTML=header('Talk to AI Bamboo','English • 中文 • Русский','🐼')+`<div class="layout"><div class="card"><div class="character" style="font-size:105px">🐼</div><h2>Your friendly learning buddy</h2><p>Pick a topic, or just chat.</p>${['Football','School','History','Space','Free Talk'].map(t=>`<button class="tag" onclick="sendText('Let’s talk about ${t}!')">${t}</button>`).join('')}<p class="footnote">This is an offline demo conversation, not a connected AI model. Real multilingual voice chat requires a secure backend and AI API.</p></div><div class="card"><h2>💬 Conversation</h2><div class="chat" id="chat"></div><div class="inputrow"><input id="chatinput" placeholder="Ask Bamboo anything..." onkeydown="if(event.key==='Enter')sendInput()"><button class="action" onclick="sendInput()">Send</button></div><button class="action ghost" onclick="speak('Hey Emin! Let’s learn something amazing together!')">🔊 Hear Bamboo</button></div></div>`;drawChat()}}function drawWord(){let w=DATA[wi];document.getElementById('flash').innerHTML=`<div class="flash"><div class="emoji">${w[0]}</div><div class="word">${w[1]}</div><div class="translation">${w[language==='zh'?2:3]}</div><p class="muted">${w[4]}</p></div><div style="text-align:center;margin-top:10px"><button class="action" onclick="speak(DATA[wi][1])">🐼 Listen</button><button class="action ghost" onclick="speak(DATA[wi][4])">💬 Sentence</button><button class="action ghost" onclick="wi=(wi+1)%DATA.length;drawWord()">Next →</button></div><div style="text-align:center" class="muted">${wi+1} / ${DATA.length}</div>`}function speak(t){if(!('speechSynthesis' in window))return alert('Voice playback unavailable');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;u.pitch=1.1;speechSynthesis.speak(u)}function drawQuiz(){let q=quiz[qi%quiz.length];answered=false;document.getElementById('quiz').innerHTML=`<div class="pill" style="display:inline-block">Question ${qi%quiz.length+1} / ${quiz.length}</div><h2 style="margin-top:20px">${q.q}</h2><div class="options">${q.a.map((a,i)=>`<button class="option" onclick="answer(${i})">${a}</button>`).join('')}</div><p id="feedback" aria-live="polite"></p><button class="action" id="nextq" style="display:none" onclick="qi++;drawQuiz()">Next question →</button>`}function answer(i){if(answered)return;answered=true;let q=quiz[qi%quiz.length],correct=i===q.ok;document.querySelectorAll('.option').forEach(b=>b.disabled=true);document.getElementById('feedback').innerHTML=`<span class="${correct?'success':'error'}">${correct?'🎉 Correct! +20 XP and 10 coins':'Almost! Try remembering this:'}</span> ${q.why}`;if(correct)earn();document.getElementById('nextq').style.display='inline-block'}const categoryProgress={football:0,discover:0,challenges:0};function drawCategoryQuiz(kind){const banks={football:footballQuiz,discover:discoverQuiz,challenges:challengeQuiz};const bank=banks[kind];const idx=categoryProgress[kind]%bank.length;const q=bank[idx];document.getElementById('categoryquiz').innerHTML=`<div class="pill" style="display:inline-block">Question ${idx+1} / ${bank.length}</div><h2 style="margin-top:20px">${q.q}</h2><div class="options">${q.a.map((a,i)=>`<button class="option" onclick="answerCategory('${kind}',${i})">${a}</button>`).join('')}</div><p id="categoryfeedback" aria-live="polite"></p><button class="action" id="categorynext" style="display:none" onclick="categoryProgress['${kind}']++;drawCategoryQuiz('${kind}')">Next question →</button>`}function answerCategory(kind,i){const bank={football:footballQuiz,discover:discoverQuiz,challenges:challengeQuiz}[kind];const q=bank[categoryProgress[kind]%bank.length];if(document.getElementById('categorynext').style.display!=='none')return;const good=i===q.ok;document.querySelectorAll('#categoryquiz .option').forEach(b=>b.disabled=true);document.getElementById('categoryfeedback').innerHTML=`<span class="${good?'success':'error'}">${good?'🎉 Correct! +20 XP and 10 coins':'Not quite!'}</span> ${q.why}`;if(good)earn();document.getElementById('categorynext').style.display='inline-block'}function buy(name,price){if(state.owned.includes(name))return alert('Already owned!');if(state.coins<price)return alert('Earn more Bamboo Coins by learning!');state.coins-=price;state.owned.push(name);save();render()}function drawChat(){let el=document.getElementById('chat');el.innerHTML=(chat.length?chat:[['bot','Hey Emin! 🐼 What would you like to talk about today?']]).map(([who,t])=>`<div class="bubble ${who==='me'?'me':''}">${escapeHtml(t)}</div>`).join('');el.scrollTop=el.scrollHeight}function escapeHtml(t){return t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function sendInput(){let el=document.getElementById('chatinput'),v=el.value.trim();if(v){el.value='';sendText(v)}}function sendText(t){chat.push(['me',t]);let reply=/football|goal|soccer/i.test(t)?'Football is awesome! ⚽ Can you tell me: “I scored a goal today”?':/history|egypt|pyramid/i.test(t)?'Did you know the ancient Egyptians built the Great Pyramid more than 4,500 years ago?':/space|planet/i.test(t)?'Mars is called the Red Planet! 🚀 What is your favorite planet?':'Great question! 🐼 In our next version, my AI brain will give you a personalized answer in English, Chinese, or Russian.';chat.push(['bot',reply]);drawChat()}function listenWord(){let out=document.getElementById('speechstatus'),SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){out.textContent=' Speech recognition not available here. Try Chrome on HTTPS.';return}let r=new SR();r.lang='en-US';r.interimResults=false;out.textContent=' Listening…';r.onresult=e=>{let heard=e.results[0][0].transcript;out.textContent=` Heard: “${heard}”. ${heard.toLowerCase().includes(DATA[wi][1].toLowerCase())?'Great job! 🎉':'Listen and try again.'}`};r.onerror=()=>out.textContent=' Microphone unavailable or permission denied.';r.start()}render();</script></body></html>
